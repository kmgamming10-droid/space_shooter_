<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arcade Space Shooter - Ultimate Beam & Missiles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #050508;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #ui-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(20, 20, 35, 0.85);
      border: 1px solid rgba(0, 255, 204, 0.3);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }
    .hud-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8a8a8a;
    }
    .hud-value {
      font-size: 18px;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }
    canvas {
      background: #020024;
      border: 2px solid #00ffcc;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      touch-action: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="ui-bar">
    <div>
      <div class="hud-title">Score</div>
      <div id="score" class="hud-value">0</div>
    </div>
    <div style="text-align: right;">
      <div class="hud-title">Arcade Engine</div>
      <div style="font-size: 12px; color: #ffd700;">PRO ULTRA BEAM</div>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>
</div>

<!-- Connects to your script.js file -->
<script src="script.js"></script>
</body>
</html>
